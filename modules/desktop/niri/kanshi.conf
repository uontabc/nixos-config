# Only manage enabled/disabled state. Nix-managed niri/config.kdl owns modes,
# refresh rates, scales and positions; GUI adjustments are session-only.
# A required wildcard matches one external output. Disabled heads still count
# as connected, so turning off eDP-1 does not switch back to the laptop profile.
profile docked {
    output eDP-1 disable
    output "*" enable
}

# Matches only when the internal panel is the sole connected output.
profile laptop {
    output eDP-1 enable
}
